version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: immortalized-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portfolio_immortalized
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_immortalized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: immortalized-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/portfolio_immortalized?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/portfolio_immortalized?schema=public
      BETTER_AUTH_SECRET: local-production-safe-entropy-token-32-chars!
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/private-vault
      KMS_PRIMARY_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    volumes:
      - vault_data:/app/private-vault

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: immortalized-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/portfolio_immortalized?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/portfolio_immortalized?schema=public
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/private-vault
      KMS_PRIMARY_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    volumes:
      - vault_data:/app/private-vault

volumes:
  postgres_data:
  vault_data:
