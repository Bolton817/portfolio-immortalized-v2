name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-verify:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Shared Packages
        run: npm run build --workspace=@portfolio-immortalized/domain && npm run build --workspace=@portfolio-immortalized/validation && npm run build --workspace=@portfolio-immortalized/api-client && npm run build --workspace=@portfolio-immortalized/server

      - name: Typecheck Workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Run Unit & Security Test Suite
        run: npm test

      - name: Build Next.js Web App
        run: npm run build --workspace=@portfolio-immortalized/web
        env:
          CI: "1"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
          BETTER_AUTH_SECRET: "ci-dummy-secret-minimum-32-chars-long!"
          BETTER_AUTH_URL: "http://localhost:3000"
